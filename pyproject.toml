[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "construct2-ai-bridge"
version = "0.1.0"
description = "Local read-only inspector and future AI bridge for Construct 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
[project.scripts]
construct2-ai-bridge = "construct2_ai_bridge.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
